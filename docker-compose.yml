services:
  # CertAuth application (runs all three services: certauth, certsec, onboard)
  certauth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certauth
    environment:
      - CERTAUTH_DEVELOPMENT=true
      - CERTAUTH_ADMIN_PASSWORD=admin123
      - PROFILE=local  # Use local profile as base
      # Direct port access for internal communication
      - CERTAUTH_URL=http://localhost:8010
      - CERTAUTH_PORT=8010
      # CertSec needs HTTPS for mTLS client certificate authentication
      - CERTSEC_URL=https://certsec.localhost
      - CERTSEC_PORT=8011
      # Onboard service should use HTTPS through Caddy for proper cookie handling
      - ONBOARD_URL=https://onboard.localhost
      - ONBOARD_PORT=8012
      # Credentials
      - TSA_USER=dev_user
      - TSA_PASSWORD=dev_password
      - SMTP_USERNAME=dev@localhost
      - SMTP_PASSWORD=dev_password
    ports:
      - "8010:8010"  # CertAuth service
      - "8011:8011"  # CertSec service
      - "8012:8012"  # Onboard service
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - ./data:/data  # Database storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Caddy reverse proxy with HTTPS/TLS
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "443:443"
      - "80:80"
    networks:
      - app-network
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - certauth

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
